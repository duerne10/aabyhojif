<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topscorerliste</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #333;
}

header {
    background: #0a6d2a;
    color: white;
    padding: 30px;
    text-align: center;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.back-button {
    display: inline-block;
    background: #0a6d2a;
    color: white;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 6px;
    margin-bottom: 20px;
    font-weight: bold;
}

.back-button:hover {
    background: #084f1f;
}

table {
    width: 100%;
    background: white;
    border-collapse: collapse;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

th {
    background: #0a6d2a;
    color: white;
    padding: 12px;
    text-align: left;
}

td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

tr:nth-child(even) {
    background: #f8f8f8;
}

.position {
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>⚽ Topscorerliste</h1>
</header>

<div class="container">

<a href="index.html" class="back-button">← Tilbage til forsiden</a>

<table>
    <thead>
        <tr>
            <th>Placering</th>
            <th>Spiller</th>
            <th>Mål</th>
        </tr>
    </thead>
    <tbody id="topscorerliste"></tbody>
</table>

</div>

<script>
fetch("data/topscorer.json")
  .then(response => response.json())
  .then(data => {

    data.sort((a, b) => b.maal - a.maal);

    let html = "";

    data.forEach((spiller, index) => {

      html += `
        <tr>
          <td class="position">${index + 1}</td>
          <td>${spiller.spiller}</td>
          <td>${spiller.maal}</td>
        </tr>
      `;
    });

    document.getElementById("topscorerliste").innerHTML = html;
  });
</script>

</body>
</html>

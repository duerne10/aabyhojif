name: Update Topscorer

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download topscorer
        run: |
          curl -L "DIN_SHAREPOINT_URL" -o data/topscorer.json

      - name: Commit if changed
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add data/topscorer.json

          git diff --staged --quiet || (
            git commit -m "Update topscorer"
            git push
          )
